[project]
name = "schift-ab"
version = "0.1.1"
description = "Python SDK for Schift-AB adaptive experiments"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.urls]
Homepage = "https://github.com/schift-io/schift-ab"
Repository = "https://github.com/schift-io/schift-ab"
Issues = "https://github.com/schift-io/schift-ab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schift_ab"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D212"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "CPY001", "D", "INP001", "S101"]
